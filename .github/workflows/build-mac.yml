name: Build Windows App XEHN

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:      # 允许你在 GitHub 网页上直接点击按钮触发编译

jobs:
  build:
    name: Build Windows Binary
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # 使用稳定的 Go 版本进行编译

    - name: Build for Windows
      run: |
        # 强制指定目标为 Windows 64位，并直接编译根目录的 main.go
        GOOS=windows GOARCH=amd64 go build -v -o xehn-windows-amd64.exe main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xehn-windows-program
        path: xehn-windows-amd64.exe
