name: Build mklogo

on:
  push:
    branches: [ "main" ]  # 当 main 分支有代码推送时触发
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # 允许你在 GitHub 网页上手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # 或者是你需要的 Go 版本

    - name: Build mklogo
      run: |
        # 因为 main.go 在 tools/mklogo 目录下，所以需要先切换目录再编译
        #cd tools/mklogo
        go build -v -o mklogo-linux main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mklogo-executable
        path: tools/mklogo/mklogo-linux
