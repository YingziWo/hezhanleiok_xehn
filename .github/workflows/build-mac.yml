name: Build Cross-Platform mklogo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    name: Build for ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 在这里配置你需要的所有系统和架构
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: darwin
            goarch: amd64
            suffix: -mac-intel
          - goos: darwin
            goarch: arm64
            suffix: -mac-m1
          - goos: linux
            goarch: amd64
            suffix: -linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Compile Binary
      run: |
        cd tools/mklogo
        # 使用矩阵变量进行交叉编译
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o mklogo${{ matrix.suffix }} main.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mklogo-${{ matrix.goos }}-${{ matrix.goarch }}
        path: tools/mklogo/mklogo${{ matrix.suffix }}
