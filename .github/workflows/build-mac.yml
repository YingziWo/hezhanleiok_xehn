name: Build Windows App XEHN

on:
 # push:
 #   branches: [ "main" ]
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    name: Build Windows Binary
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build for Windows
      run: |
        # 注意最后是一个点「.」，代表编译整个目录，而不是单个 main.go
        GOOS=windows GOARCH=amd64 go build -v -o xehn-windows-amd64.exe .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xehn-windows-program
        path: xehn-windows-amd64.exe
